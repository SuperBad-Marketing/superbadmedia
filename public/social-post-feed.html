<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>SuperBad — Feed Post</title>
<style>
  @font-face { font-family: 'Black Han Sans'; src: url('fonts/black-han-sans-400.woff2') format('woff2'); }
  @font-face { font-family: 'Righteous'; src: url('fonts/righteous-400.woff2') format('woff2'); }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/playfair-display-italic-var.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'DM Sans'; src: url('fonts/dm-sans-var.woff2') format('woff2'); }
  @font-face { font-family: 'Pacifico'; src: url('fonts/pacifico-400.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #B22848;
    --cream: #FDF5E6;
    --pink: #F4A0B0;
    --orange: #F28C52;
    --charcoal: #1A1A18;
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--charcoal);
    position: relative;
    font-family: 'DM Sans', sans-serif;
  }

  /* Grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 100;
    opacity: 0.035;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Retro geometric accents */
  .geo-circle {
    position: absolute;
    border-radius: 50%;
    border: 3px solid var(--red);
    opacity: 0;
    animation: geoFadeIn 0.8s ease-out forwards;
  }
  .geo-circle.c1 { width: 340px; height: 340px; top: -80px; right: -60px; animation-delay: 1.4s; }
  .geo-circle.c2 { width: 180px; height: 180px; bottom: 120px; left: -40px; border-color: var(--pink); animation-delay: 1.8s; }
  .geo-circle.c3 { width: 90px; height: 90px; bottom: 60px; right: 140px; border-color: var(--orange); animation-delay: 2.1s; }

  /* Horizontal accent lines */
  .accent-line {
    position: absolute;
    height: 2px;
    background: var(--red);
    opacity: 0;
    animation: lineSlide 0.6s ease-out forwards;
  }
  .accent-line.l1 { top: 200px; left: 80px; width: 0; animation-delay: 0.8s; }
  .accent-line.l2 { top: 210px; left: 80px; width: 0; animation-delay: 0.9s; background: var(--pink); }

  @keyframes lineSlide {
    to { width: 180px; opacity: 0.6; }
  }

  /* Main content container */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px;
  }

  /* Subheading */
  .subheading {
    font-family: 'Righteous', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 18px;
    color: var(--pink);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  /* Hero headline */
  .headline {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 108px;
    line-height: 0.92;
    color: var(--cream);
    margin-top: 24px;
    opacity: 0;
    transform: translateY(40px);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .headline .red {
    color: var(--red);
    display: inline-block;
    opacity: 0;
    transform: translateY(40px) rotate(-1deg);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
  }

  /* Editorial quote */
  .quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--pink);
    margin-top: 48px;
    max-width: 600px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
  }

  /* Body mutter */
  .mutter {
    font-family: 'DM Sans', sans-serif;
    font-style: italic;
    font-size: 16px;
    color: var(--pink);
    opacity: 0;
    margin-top: 16px;
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
    transform: translateY(10px);
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px;
    transform: translateY(100%);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
  }

  .bottom-bar .logo {
    font-family: 'Pacifico', cursive;
    font-size: 28px;
    color: var(--cream);
  }

  .bottom-bar .handle {
    font-family: 'Righteous', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 14px;
    color: var(--cream);
    opacity: 0.8;
  }

  /* Red vertical stripe accent */
  .v-stripe {
    position: absolute;
    top: 0;
    right: 88px;
    width: 4px;
    height: 0;
    background: linear-gradient(180deg, var(--red), var(--orange));
    animation: stripeGrow 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  /* Dot grid */
  .dot-grid {
    position: absolute;
    bottom: 100px;
    right: 80px;
    display: grid;
    grid-template-columns: repeat(4, 12px);
    gap: 14px;
    opacity: 0;
    animation: geoFadeIn 0.6s ease-out 2.2s forwards;
  }
  .dot-grid .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--pink);
    opacity: 0.4;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }
  @keyframes slideUp {
    to { transform: translateY(0); }
  }
  @keyframes geoFadeIn {
    to { opacity: 0.25; }
  }
  @keyframes stripeGrow {
    to { height: 400px; }
  }

  /* Looping subtle pulse on the headline red word */
  .headline .red {
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards,
               subtlePulse 4s ease-in-out 2.5s infinite;
  }
  @keyframes subtlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="v-stripe"></div>

  <div class="geo-circle c1"></div>
  <div class="geo-circle c2"></div>
  <div class="geo-circle c3"></div>

  <div class="accent-line l1"></div>
  <div class="accent-line l2"></div>

  <div class="content">
    <div class="subheading">Marketing that doesn't suck</div>
    <div class="headline">
      Your brand<br>
      deserves<br>
      <span class="red">better.</span>
    </div>
    <div class="quote">"We don't do motivation posts.<br>We do results that speak for themselves."</div>
    <div class="mutter">(...most of the time.)</div>
  </div>

  <div class="dot-grid">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="bottom-bar">
    <div class="logo">SuperBad</div>
    <div class="handle">@superbadmedia</div>
  </div>
</body>
</html>
