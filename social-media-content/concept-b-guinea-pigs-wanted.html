<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Concept B, Guinea Pigs Wanted</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Righteous&family=Playfair+Display:ital@1&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Pacifico&display=swap" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --charcoal: #1A1A18;
      --red: #B22848;
      --cream: #FDF5E6;
      --pink: #F4A0B0;
      --orange: #F28C52;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    #toolbar button {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      transition: all 0.2s;
    }
    #toolbar button:hover { background: #3a3a3a; color: #ddd; }
    #toolbar button.active { background: var(--red); color: var(--cream); border-color: var(--red); }
    #toolbar .sep { width: 1px; height: 24px; background: #444; margin: 0 6px; }
    #toolbar .dl { background: var(--red); color: var(--cream); border-color: var(--red); }
    #toolbar .dl:hover { background: #d13460; }
    #toolbar .label { color: #666; font-size: 11px; font-family: 'Righteous', cursive; text-transform: uppercase; letter-spacing: 2px; }

    /* ── Format sizes ── */
    .design {
      position: relative;
      overflow: hidden;
      background: var(--charcoal);
      background-image: radial-gradient(ellipse at 60% 55%, rgba(178,40,72,0.035) 0%, transparent 50%);
    }
    .format-square   { width: 1080px; height: 1080px; }
    .format-portrait  { width: 1080px; height: 1350px; }
    .format-story     { width: 1080px; height: 1920px; }
    .format-linkedin  { width: 1200px; height: 628px;  }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }
    .format-square .content   { padding: 100px 110px; }
    .format-portrait .content { padding: 160px 110px; }
    .format-story .content    { padding: 380px 110px; }
    .format-linkedin .content { padding: 55px 80px;   }

    /* ── Line 1: "I built a" ── */
    .line-intro {
      font-family: 'DM Sans', sans-serif;
      font-style: italic;
      color: var(--pink);
    }
    .format-square .line-intro,
    .format-portrait .line-intro,
    .format-story .line-intro    { font-size: 30px; }
    .format-linkedin .line-intro { font-size: 22px; }

    /* ── Line 2: "personality test" ── */
    .line-main {
      font-family: 'Black Han Sans', sans-serif;
      color: var(--cream);
      line-height: 1.05;
    }
    .format-square .line-main,
    .format-portrait .line-main { font-size: 92px; margin-top: 4px; }
    .format-story .line-main    { font-size: 96px; margin-top: 8px; }
    .format-linkedin .line-main { font-size: 62px; margin-top: 2px; }

    /* ── Line 3: "for brands." ── */
    .line-accent {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--red);
    }
    .format-square .line-accent,
    .format-portrait .line-accent { font-size: 52px; margin-top: 2px; }
    .format-story .line-accent    { font-size: 56px; margin-top: 4px; }
    .format-linkedin .line-accent { font-size: 36px; margin-top: 0;   }

    /* ── Gap + beta lines ── */
    .beta-block {
      display: flex;
      flex-direction: column;
    }
    .format-square .beta-block   { margin-top: 48px; gap: 6px; }
    .format-portrait .beta-block { margin-top: 64px; gap: 8px; }
    .format-story .beta-block    { margin-top: 88px; gap: 10px; }
    .format-linkedin .beta-block { margin-top: 28px; gap: 4px; }

    .line-beta {
      font-family: 'DM Sans', sans-serif;
      color: rgba(253,245,230,0.75);
    }
    .format-square .line-beta,
    .format-portrait .line-beta,
    .format-story .line-beta    { font-size: 24px; }
    .format-linkedin .line-beta { font-size: 18px; }

    .line-guinea {
      font-family: 'DM Sans', sans-serif;
      font-style: italic;
      color: var(--pink);
    }
    .format-square .line-guinea,
    .format-portrait .line-guinea,
    .format-story .line-guinea    { font-size: 24px; }
    .format-linkedin .line-guinea { font-size: 18px; }

    /* ── Bottom section ── */
    .divider-line {
      background: rgba(253,245,230,0.10);
      height: 1px;
    }
    .format-square .divider-line   { width: 60px; margin-top: 52px; }
    .format-portrait .divider-line { width: 60px; margin-top: 68px; }
    .format-story .divider-line    { width: 60px; margin-top: 100px; }
    .format-linkedin .divider-line { width: 50px; margin-top: 26px; }

    .cta {
      font-family: 'Righteous', cursive;
      text-transform: uppercase;
      color: rgba(253,245,230,0.55);
    }
    .format-square .cta,
    .format-portrait .cta,
    .format-story .cta    { font-size: 11px; letter-spacing: 3px; margin-top: 22px; }
    .format-linkedin .cta { font-size: 10px; letter-spacing: 2.5px; margin-top: 14px; }

    .url {
      font-family: 'DM Sans', sans-serif;
      color: rgba(253,245,230,0.28);
    }
    .format-square .url,
    .format-portrait .url,
    .format-story .url    { font-size: 13px; margin-top: 8px; }
    .format-linkedin .url { font-size: 11px; margin-top: 5px; }

    /* ── Brand mark ── */
    .mark {
      position: absolute;
      font-family: 'Pacifico', cursive;
      color: rgba(253,245,230,0.10);
    }
    .format-square .mark   { font-size: 16px; bottom: 44px; right: 52px; }
    .format-portrait .mark { font-size: 16px; bottom: 52px; right: 52px; }
    .format-story .mark    { font-size: 18px; bottom: 60px; right: 56px; }
    .format-linkedin .mark { font-size: 14px; bottom: 28px; right: 40px; }

    /* ── Accent bar ── */
    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(to bottom, var(--orange), var(--red));
      opacity: 0.5;
    }

    /* ── Decorative quotation mark ── */
    .deco-quote {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: rgba(178,40,72,0.06);
      line-height: 1;
      pointer-events: none;
    }
    .format-square .deco-quote   { font-size: 400px; right: 40px; top: -40px; }
    .format-portrait .deco-quote { font-size: 440px; right: 40px; top: -20px; }
    .format-story .deco-quote    { font-size: 480px; right: 40px; top: 80px; }
    .format-linkedin .deco-quote { font-size: 280px; right: 20px; top: -50px; }
  </style>
</head>
<body>

  <div id="toolbar">
    <span class="label">Format</span>
    <button class="active" id="btn-square" onclick="setFormat('square')">Square 1080×1080</button>
    <button id="btn-portrait" onclick="setFormat('portrait')">Portrait 1080×1350</button>
    <button id="btn-story" onclick="setFormat('story')">Story 1080×1920</button>
    <button id="btn-linkedin" onclick="setFormat('linkedin')">LinkedIn 1200×628</button>
    <span class="sep"></span>
    <button class="dl" id="btn-download" onclick="downloadPNG()">↓ Download PNG</button>
  </div>

  <div id="design" class="design format-square">

    <div class="accent-bar"></div>
    <div class="deco-quote">"</div>

    <div class="content">
      <div class="line-intro">I built a</div>
      <div class="line-main">personality test</div>
      <div class="line-accent">for brands.</div>

      <div class="beta-block">
        <div class="line-beta">It's in beta.</div>
        <div class="line-guinea">I need guinea pigs.</div>
      </div>

      <div class="divider-line"></div>
      <div class="cta">Tell me if it's accurate</div>
      <div class="url">superbadmedia.com.au/rundown</div>
    </div>

    <div class="mark">SuperBad</div>
  </div>

  <script>
    let currentFormat = 'square';
    function setFormat(format) {
      currentFormat = format;
      const design = document.getElementById('design');
      design.className = 'design format-' + format;
      document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btn-' + format);
      if (btn) btn.classList.add('active');
    }
    async function downloadPNG() {
      const btn = document.getElementById('btn-download');
      btn.textContent = 'Rendering…';
      await document.fonts.ready;
      try {
        const design = document.getElementById('design');
        const canvas = await html2canvas(design, {
          scale: 1,
          useCORS: true,
          backgroundColor: null,
          width: design.offsetWidth,
          height: design.offsetHeight,
        });
        const link = document.createElement('a');
        link.download = 'superbad-brand-dna-concept-b-' + currentFormat + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert('Download failed, try screenshotting the design instead.');
      }
      btn.textContent = '↓ Download PNG';
    }
  </script>
</body>
</html>
