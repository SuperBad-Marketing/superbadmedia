<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Editor — Skill File Tracker</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-hover: #1a1a1a;
    --border: #222;
    --border-active: #333;
    --text: #e5e5e5;
    --text-muted: #777;
    --text-dim: #555;
    --accent: #e53935;
    --accent-dim: rgba(229, 57, 53, 0.15);
    --green: #4caf50;
    --green-dim: rgba(76, 175, 80, 0.15);
    --amber: #ff9800;
    --amber-dim: rgba(255, 152, 0, 0.15);
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .header {
    padding: 48px 40px 32px;
    max-width: 960px;
    margin: 0 auto;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  .progress-bar-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 40px 32px;
  }

  .progress-bar-outer {
    background: var(--surface);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-bar-inner {
    height: 100%;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .category {
    max-width: 960px;
    margin: 0 auto 32px;
    padding: 0 40px;
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .category-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
  }

  .category-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }

  .skill-card:hover {
    border-color: var(--border-active);
  }

  .skill-card.completed {
    opacity: 0.5;
  }

  .skill-card.completed .skill-title {
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  .skill-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }

  .skill-checkbox {
    appearance: none;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 2px solid var(--border-active);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }

  .skill-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .skill-checkbox:checked::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 12px;
    font-weight: 700;
  }

  .skill-info {
    flex: 1;
  }

  .skill-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .skill-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .skill-desc {
    font-size: 13px;
    color: var(--text-muted);
  }

  .skill-toggle {
    color: var(--text-dim);
    font-size: 18px;
    transition: transform 0.2s ease;
    padding: 4px;
  }

  .skill-card.expanded .skill-toggle {
    transform: rotate(180deg);
  }

  .skill-details {
    display: none;
    padding: 0 20px 20px 54px;
  }

  .skill-card.expanded .skill-details {
    display: block;
  }

  .detail-section {
    margin-bottom: 16px;
  }

  .detail-section:last-child {
    margin-bottom: 0;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .detail-list {
    list-style: none;
  }

  .detail-list li {
    font-size: 13px;
    color: var(--text-muted);
    padding: 4px 0;
    padding-left: 16px;
    position: relative;
  }

  .detail-list li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--text-dim);
  }

  .source-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 8px;
  }

  .source-tag.youtube {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .source-tag.docs {
    background: var(--green-dim);
    color: var(--green);
  }

  .source-tag.both {
    background: var(--amber-dim);
    color: var(--amber);
  }

  .notes-field {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
    margin-top: 8px;
    transition: border-color 0.2s;
  }

  .notes-field:focus {
    outline: none;
    border-color: var(--accent);
  }

  .notes-field::placeholder {
    color: var(--text-dim);
  }

  .footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 40px 48px;
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-active);
  }

  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .btn-accent:hover {
    background: #c62828;
    border-color: #c62828;
  }

  .save-indicator {
    font-size: 12px;
    color: var(--green);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
  }

  .save-indicator.visible {
    opacity: 1;
  }

  @media (max-width: 640px) {
    .header, .category, .progress-bar-container, .footer {
      padding-left: 20px;
      padding-right: 20px;
    }
    .skill-details {
      padding-left: 20px;
    }
  }
</style>

const categories = {
  resolve: { label: 'Resolve Core', color: '--green' },
  craft: { label: 'Editorial Craft', color: '--accent' },
  integration: { label: 'Integration & Workflow', color: '--amber' }
};

function getState() {
  try {
    return JSON.parse(localStorage.getItem('skillTracker') || '{}');
  } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem('skillTracker', JSON.stringify(state));
  showSaveIndicator();
}

function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 1500);
}

function updateProgress() {
  const state = getState();
  const completed = skills.filter(s => state[s.id]?.completed).length;
  const total = skills.length;
  const pct = Math.round((completed / total) * 100);

  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = completed + ' / ' + total + ' complete';
  document.getElementById('progressPercent').textContent = pct + '%';

  Object.keys(categories).forEach(cat => {
    const catSkills = skills.filter(s => s.category === cat);
    const catDone = catSkills.filter(s => state[s.id]?.completed).length;
    const el = document.getElementById('count-' + cat);
    if (el) el.textContent = catDone + ' / ' + catSkills.length;
  });
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
}

function toggleComplete(id, e) {
  e.stopPropagation();
  const state = getState();
  if (!state[id]) state[id] = {};
  state[id].completed = !state[id].completed;
  saveState(state);

  const card = document.getElementById('card-' + id);
  card.classList.toggle('completed', state[id].completed);
  updateProgress();
}

function saveNotes(id, value) {
  const state = getState();
  if (!state[id]) state[id] = {};
  state[id].notes = value;
  saveState(state);
}

function expandAll() {
  document.querySelectorAll('.skill-card').forEach(c => c.classList.add('expanded'));
}

function collapseAll() {
  document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('expanded'));
}

function resetAll() {
  if (!confirm('Reset all progress and notes? This cannot be undone.')) return;
  localStorage.removeItem('skillTracker');
  location.reload();
}

function render() {
  const state = getState();
  const container = document.getElementById('skillList');
  let html = '';

  Object.entries(categories).forEach(([catKey, catInfo]) => {
    const catSkills = skills.filter(s => s.category === catKey);
    const catDone = catSkills.filter(s => state[s.id]?.completed).length;

    html += `<div class="category">
      <div class="category-header">
        <span class="category-label">${catInfo.label}</span>
        <span class="category-count" id="count-${catKey}">${catDone} / ${catSkills.length}</span>
      </div>`;

    catSkills.forEach(skill => {
      const isCompleted = state[skill.id]?.completed || false;
      const notes = state[skill.id]?.notes || '';
      const sourceLabels = { youtube: 'YouTube', docs: 'Docs', both: 'Both' };

      html += `<div class="skill-card${isCompleted ? ' completed' : ''}" id="card-${skill.id}">
        <div class="skill-header" onclick="toggleCard('${skill.id}')">
          <input type="checkbox" class="skill-checkbox" ${isCompleted ? 'checked' : ''} onclick="toggleComplete('${skill.id}', event)">
          <div class="skill-info">
            <div class="skill-number">${skill.number} <span class="source-tag ${skill.source}">${sourceLabels[skill.source]}</span></div>
            <div class="skill-title">${skill.title}</div>
            <div class="skill-desc">${skill.desc}</div>
          </div>
          <div class="skill-toggle">▾</div>
        </div>
        <div class="skill-details">
          <div class="detail-section">
            <div class="detail-label">Topics the skill file should cover</div>
            <ul class="detail-list">
              ${skill.topics.map(t => `<li>${t}</li>`).join('')}
            </ul>
          </div>
          <div class="detail-section">
            <div class="detail-label">Recommended video sources</div>
            <ul class="detail-list">
              ${skill.videoTopics.map(t => `<li>${t}</li>`).join('')}
            </ul>
          </div>
          <div class="detail-section">
            <div class="detail-label">Notes</div>
            <textarea class="notes-field" placeholder="Paste video URLs, notes, or anything else here..." oninput="saveNotes('${skill.id}', this.value)">${notes}</textarea>
          </div>
        </div>
      </div>`;
    });

    html += '</div>';
  });

  container.innerHTML = html;
  updateProgress();
}

render();
</script>
